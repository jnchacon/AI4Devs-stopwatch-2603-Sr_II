<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro - StopWatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Importación de fuente limpia para el display */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
        .font-mono-chrono {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-lg md:max-w-2xl lg:max-w-4xl flex flex-col items-center gap-12 md:gap-16">
        
        <div class="bg-blue-50 border-[6px] md:border-[8px] border-gray-950 rounded-full px-8 py-10 md:px-16 md:py-14 w-full flex justify-center items-end relative shadow-lg">
            <div class="flex items-baseline relative font-mono-chrono text-gray-950">
                <span id="display" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-bold leading-none tracking-tighter">
                    00:00:00
                </span>
                <span id="ms-display" class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-medium absolute -bottom-2 -right-12 sm:-bottom-3 sm:-right-14 md:-bottom-4 md:-right-16 lg:-bottom-5 lg:-right-20">
                    000
                </span>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-6 sm:gap-10 w-full justify-center items-center">
            <button id="startBtn" class="w-full sm:w-auto min-w-[220px] md:min-w-[280px] bg-green-500 hover:bg-green-600 border-[5px] border-gray-950 rounded-2xl text-4xl md:text-5xl font-bold text-gray-950 px-10 py-5 transition-colors shadow-md focus:outline-none focus:ring-4 focus:ring-green-300">
                Start
            </button>
            
            <button id="stopBtn" class="w-full sm:w-auto min-w-[220px] md:min-w-[280px] bg-red-600 hover:bg-red-700 border-[5px] border-gray-950 rounded-2xl text-4xl md:text-5xl font-bold text-gray-950 px-10 py-5 transition-colors shadow-md focus:outline-none focus:ring-4 focus:ring-red-300">
                Stop
            </button>
        </div>

    </main>

    <script src="script.js" defer></script>
</body>
</html>
